name: Deploy original product to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:web
      - name: Build original React product
        env:
          VITE_BASE_PATH: /sih-project/
          VITE_PAGES: 'true'
          VITE_API_URL: ${{ vars.DEMO_API_URL }}
          VITE_FULL_APP_URL: ${{ vars.DEMO_FULL_APP_URL }}
          VITE_FULL_APP_ONLY: ${{ vars.DEMO_FULL_APP_ONLY }}
        run: |
          node -e 'for (const k of ["VITE_API_URL","VITE_FULL_APP_URL"]) { if (process.env[k] && new URL(process.env[k]).protocol !== "https:") throw Error(k + " must use HTTPS"); }'
          pnpm build
          mv apps/web/dist /tmp/fleet-pages-portal
          VITE_PAGES=false VITE_BASE_PATH=https://pallavpushkar3-gif.github.io/sih-project/full-app/ VITE_API_URL="" VITE_API_BASE_URL="" VITE_FULL_APP_URL="" VITE_FULL_APP_ONLY=false pnpm build
          mv apps/web/dist /tmp/fleet-complete-product
          mv /tmp/fleet-pages-portal apps/web/dist
          mv /tmp/fleet-complete-product apps/web/dist/full-app
          touch apps/web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
