name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff check backend/src backend/tests
      - run: mypy backend/src/fleet_maintenance
      - run: python -m pytest backend/tests/unit backend/tests/verification
