name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.23
      - run: uv sync --project backend --locked --extra dev --extra science
      - run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check backend/src backend/tests
      - run: mypy --exclude 'science/prediction/(sequence|sequence_training)\.py' backend/src/fleet_maintenance
      - run: python -m pytest backend/tests/unit backend/tests/verification
      - run: python -m pytest backend/tests/science
